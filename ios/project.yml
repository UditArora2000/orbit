name: Orbit
options:
  bundleIdPrefix: com.udit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - Orbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.udit.orbit
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Orbit/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        NSContactsUsageDescription: Orbit reads your contacts so you can file each person and build your call rotation. Everything stays on this phone.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.udit.orbit.refresh]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
